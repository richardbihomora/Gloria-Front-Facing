# Deploys gloriatech.co to Bluehost on every push to main.
#
# How it works
#   1. Copies the site into a clean dist folder (no .git, no workflow files,
#      no notes) and rewrites <base href="/Gloria-Front-Facing/"> to "/", since
#      GitHub Pages serves the preview under a folder and Bluehost serves the
#      real site at the domain root.
#   2. Uploads dist to the web root over SFTP with OpenSSH's sftp client and a
#      dedicated deploy key (Bluehost allows SFTP with the key even though
#      shell access is off, so rsync-over-ssh is not an option). Every file in
#      dist is sent; files on the server that are not in the repo are left
#      alone, so nothing outside this repo is ever removed.
#
# Secrets (GitHub repo settings -> Secrets and variables -> Actions):
#   BLUEHOST_SSH_HOST   server IP or host, e.g. 50.6.2.223
#   BLUEHOST_SSH_USER   cPanel username
#   BLUEHOST_SSH_KEY    private half of the deploy key (ed25519); the public
#                       half is imported and authorized in cPanel -> SSH Access
# Variables (same page, Variables tab):
#   BLUEHOST_WEB_ROOT   document root relative to the account home,
#                       e.g. public_html/website_02deece1
#
# Run it by hand from the Actions tab with "dry run" ticked to print the
# upload plan without connecting.

name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the upload plan, upload nothing)"
        type: boolean
        default: false

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Build the dist folder
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '.DS_Store' \
            --exclude '.nojekyll' \
            --exclude '*.md' \
            ./ dist/
          # Serve from the domain root on Bluehost.
          find dist -name '*.html' -print0 | xargs -0 sed -i 's#<base href="/Gloria-Front-Facing/">#<base href="/">#'
          echo "Files in dist: $(find dist -type f | wc -l)"
          if grep -rl 'Gloria-Front-Facing' dist --include='*.html' --include='*.css' --include='*.js'; then
            echo "A file still references the GitHub Pages folder"; exit 1
          fi

      - name: Write the upload plan
        env:
          WEB_ROOT: ${{ vars.BLUEHOST_WEB_ROOT }}
        run: |
          set -euo pipefail
          test -n "$WEB_ROOT"
          {
            # Directories first (leading dash: ignore "already exists").
            find dist -mindepth 1 -type d | sort | sed "s#^dist/#-mkdir $WEB_ROOT/#"
            # Then every file.
            find dist -type f | sort | sed "s#^dist/\(.*\)#put dist/\1 $WEB_ROOT/\1#"
            echo "bye"
          } > upload.sftp
          echo "Upload plan: $(grep -c '^put ' upload.sftp) files, $(grep -c '^-mkdir ' upload.sftp) directories"
          cat upload.sftp

      - name: Set up the deploy key
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BLUEHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${{ secrets.BLUEHOST_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to Bluehost over SFTP
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          USER: ${{ secrets.BLUEHOST_SSH_USER }}
          WEB_ROOT: ${{ vars.BLUEHOST_WEB_ROOT }}
        run: |
          set -euo pipefail
          sftp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            -b upload.sftp "$USER@$HOST" | grep -E '^(Uploading|-?mkdir)' || true
          echo "Deployed $(grep -c '^put ' upload.sftp) files to $USER@$HOST:$WEB_ROOT"
